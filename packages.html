<!-- file: packages.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Health Packages - Selfcare Diagnostics</title>
  
  <!-- Favicon & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#078866">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Versioned Stylesheets matching Tests Page -->
  <link rel="stylesheet" href="assets/css/global.css?v=5.4.0">
  <link rel="stylesheet" href="assets/css/components.css?v=5.4.0">
  <link rel="stylesheet" href="assets/css/responsive.css?v=5.4.0">
  <link rel="stylesheet" href="assets/css/packages.css?v=5.4.0">

  <style>
    /* Sticky Top Bar (Search + Category Selection) */
    .search-section {
      position: sticky !important;
      top: 0 !important;
      z-index: 100 !important;
      background: #F4FBF9 !important;
      padding-top: 10px !important;
      padding-bottom: 8px !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      margin-bottom: 15px !important;
    }

    .search-bar {
      display: flex !important;
      align-items: center !important;
      padding: 10px 14px !important;
      gap: 10px !important;
      border-radius: 14px !important;
      background: rgba(255, 255, 255, 0.98) !important;
      box-shadow: 0 4px 18px rgba(7, 136, 102, 0.08) !important;
      border: 1px solid rgba(7, 136, 102, 0.22) !important;
      margin-bottom: 8px !important;
    }

    .search-bar input {
      flex: 1 !important;
      background: transparent !important;
      font-size: 13px !important;
      color: #10231E !important;
      font-weight: 500 !important;
      border: none !important;
      outline: none !important;
    }

    /* Category Selection Scroll Bar */
    .category-selection-container {
      width: 100% !important;
      overflow: hidden !important;
      margin-top: 4px !important;
    }

    .category-track {
      display: flex !important;
      gap: 8px !important;
      overflow-x: auto !important;
      padding: 4px 2px 6px 2px !important;
      scroll-behavior: smooth !important;
      -webkit-overflow-scrolling: touch !important;
      scrollbar-width: none !important;
    }

    .category-track::-webkit-scrollbar {
      display: none !important;
    }

    .cat-pill {
      padding: 7px 15px !important;
      border-radius: 20px !important;
      font-size: 11.5px !important;
      font-weight: 700 !important;
      white-space: nowrap !important;
      background: rgba(255, 255, 255, 0.95) !important;
      border: 1px solid rgba(7, 136, 102, 0.22) !important;
      color: #045D49 !important;
      cursor: pointer !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
      box-shadow: 0 2px 8px rgba(7, 136, 102, 0.06) !important;
      flex-shrink: 0 !important;
    }

    .cat-pill:hover {
      background: #E8F7F2 !important;
      border-color: #078866 !important;
      transform: translateY(-1px) !important;
    }

    .cat-pill.active {
      background: linear-gradient(135deg, #078866, #045D49) !important;
      color: #FFFFFF !important;
      border-color: #045D49 !important;
      box-shadow: 0 4px 14px rgba(7, 136, 102, 0.35) !important;
      transform: scale(1.02) !important;
    }

    /* 2-Column Compact Grid matching Tests Page */
    .packages-grid {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 10px !important;
      margin-bottom: 40px !important;
    }

    .package-card {
      position: relative !important;
      padding: 12px !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      gap: 8px !important;
      background: #FFFFFF !important;
      border: 1px solid rgba(0, 0, 0, 0.08) !important;
      border-radius: 14px !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04) !important;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .package-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    /* Neon Glowing Light Effect for SCD pack 003 */
    .neon-glowing-card {
      border: 2px solid #00F5D4 !important;
      background: linear-gradient(160deg, #FFFFFF 0%, #F0FDF8 100%) !important;
      box-shadow: 0 0 16px rgba(0, 245, 212, 0.45), 0 0 32px rgba(0, 245, 212, 0.2), 0 4px 15px rgba(0, 0, 0, 0.04) !important;
      animation: neonGlowPulse 2.2s infinite alternate ease-in-out !important;
    }

    @keyframes neonGlowPulse {
      0% {
        border-color: #00F5D4;
        box-shadow: 0 0 12px rgba(0, 245, 212, 0.4), 0 0 24px rgba(0, 245, 212, 0.2), inset 0 0 8px rgba(0, 245, 212, 0.1);
        transform: translateY(0);
      }
      50% {
        border-color: #05FFA1;
        box-shadow: 0 0 22px rgba(5, 255, 161, 0.75), 0 0 42px rgba(0, 245, 212, 0.4), inset 0 0 14px rgba(5, 255, 161, 0.2);
        transform: translateY(-2px);
      }
      100% {
        border-color: #00F5D4;
        box-shadow: 0 0 12px rgba(0, 245, 212, 0.4), 0 0 24px rgba(0, 245, 212, 0.2), inset 0 0 8px rgba(0, 245, 212, 0.1);
        transform: translateY(0);
      }
    }

    .neon-recommended-badge {
      position: absolute !important;
      top: -10px !important;
      right: 10px !important;
      background: linear-gradient(135deg, #00F5D4, #078866) !important;
      color: #033F33 !important;
      font-size: 8.5px !important;
      font-weight: 900 !important;
      letter-spacing: 0.6px !important;
      padding: 3px 8px !important;
      border-radius: 20px !important;
      box-shadow: 0 0 12px rgba(0, 245, 212, 0.8), 0 2px 6px rgba(0, 0, 0, 0.15) !important;
      text-transform: uppercase !important;
      z-index: 10 !important;
      display: flex !important;
      align-items: center !important;
      gap: 3px !important;
    }

    .package-card-top {
      display: flex !important;
      flex-direction: column !important;
      gap: 4px !important;
    }

    .package-card-header-row {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      margin-bottom: 2px !important;
    }

    .package-card-top h4 {
      font-size: 12px !important;
      font-weight: 700 !important;
      color: #10231E !important;
      line-height: 1.3 !important;
      min-height: 32px !important;
    }

    .package-code-tag {
      font-size: 9px !important;
      font-weight: 700 !important;
      color: #536E66 !important;
      text-transform: uppercase !important;
    }

    .card-fasting-tag {
      font-size: 8px !important;
      font-weight: 800 !important;
      padding: 2px 6px !important;
      border-radius: 6px !important;
      text-transform: uppercase !important;
      letter-spacing: 0.2px !important;
      white-space: nowrap !important;
    }

    .card-fasting-tag.fasting {
      background: rgba(228, 0, 90, 0.1) !important;
      color: #E4005A !important;
      border: 1px solid rgba(228, 0, 90, 0.25) !important;
    }

    .card-fasting-tag.non-fasting {
      background: rgba(7, 136, 102, 0.1) !important;
      color: #078866 !important;
      border: 1px solid rgba(7, 136, 102, 0.25) !important;
    }

    .card-param-badge {
      display: inline-flex !important;
      align-items: center !important;
      gap: 4px !important;
      background: rgba(7, 136, 102, 0.08) !important;
      color: #045D49 !important;
      border: 1px solid rgba(7, 136, 102, 0.2) !important;
      font-size: 9.5px !important;
      font-weight: 700 !important;
      padding: 3px 6px !important;
      border-radius: 6px !important;
      width: fit-content !important;
      margin-top: 2px !important;
    }

    .know-more-row {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding: 6px 8px !important;
      background: rgba(111, 66, 193, 0.05) !important;
      border-radius: 6px !important;
      cursor: pointer !important;
    }

    .know-more-text {
      flex: 1 !important;
      margin-left: 5px !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      color: #6b21a8 !important;
    }

    .info-icon, .arrow-icon {
      font-size: 11px !important;
      color: #6b21a8 !important;
    }

    .package-pricing-row {
      display: flex !important;
      align-items: baseline !important;
      gap: 6px !important;
    }

    .mrp {
      font-size: 11px !important;
      color: #dc2626 !important;
      text-decoration: line-through !important;
      font-weight: 600 !important;
    }

    .offer-price {
      font-size: 13px !important;
      font-weight: 800 !important;
      color: #10231E !important;
    }

    .book-btn {
      width: 100% !important;
      padding: 8px 6px !important;
      font-size: 11px !important;
      font-weight: 700 !important;
      border-radius: 8px !important;
      border: none !important;
      cursor: pointer !important;
      text-align: center !important;
      transition: all 0.2s ease;
    }

    .add-cart-btn {
      background: #E4005A !important;
      color: #ffffff !important;
    }

    .book-btn.added-btn {
      background: #10b981 !important;
      color: #ffffff !important;
    }

    .bottom-nav {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 900 !important;
      display: flex !important;
      justify-content: space-around !important;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom)) 6px !important;
      background: rgba(255, 255, 255, 0.98) !important;
      backdrop-filter: blur(24px) !important;
      -webkit-backdrop-filter: blur(24px) !important;
      border-top: 1px solid rgba(7, 136, 102, 0.15) !important;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.06) !important;
    }

    .nav-item {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      gap: 2px !important;
      text-decoration: none !important;
      color: #536E66 !important;
      font-size: 10px !important;
      font-weight: 700 !important;
      position: relative !important;
      flex: 1 !important;
      text-align: center !important;
    }

    .nav-item span:first-child {
      font-size: 18px !important;
    }

    .nav-item.active, .nav-item:hover {
      color: #E4005A !important;
    }

    .cart-badge {
      position: absolute !important;
      top: -4px !important;
      right: calc(50% - 16px) !important;
      background: #E4005A !important;
      color: #FFFFFF !important;
      font-size: 9px !important;
      font-weight: 800 !important;
      padding: 1px 5px !important;
      border-radius: 10px !important;
      min-width: 16px !important;
      text-align: center !important;
    }
  </style>
</head>
<body>

  <!-- Main Container -->
  <main class="main-container" style="padding-top: 10px;">
    
    <!-- Top Sticky Search Bar & Category Selection Option -->
    <section class="search-section">
      <div class="search-bar glass-card">
        <span class="search-icon">🔍</span>
        <input type="text" id="packages-search-input" placeholder="Search packages by name, symptoms (e.g. fever, joint pain)..." autocomplete="off">
        <button class="voice-search-btn" id="voice-search-btn" onclick="PackagesPage.startVoiceSearch()" title="Voice Search">🎙️</button>
      </div>

      <!-- Category Selection Option Bar (Replaces Carousel) -->
      <div class="category-selection-container">
        <div class="category-track" id="categoryFilterTrack">
          <button class="cat-pill active" onclick="PackagesPage.selectCategory('All')">All Packages</button>
          <!-- Dynamic categories populated from Backend via packages.js -->
        </div>
      </div>
    </section>

    <!-- Packages Catalogue Container (2-Column Grid) -->
    <section class="catalogue-section">
      <div id="packages-catalogue-container" class="packages-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </section>

  </main>

  <!-- 5-Tab Fixed Bottom Navigation Matching Customer & Tests Pages -->
  <nav class="bottom-nav glass-card">
    <a href="customer.html" class="nav-item">
      <span>🏠</span>
      <span>Home</span>
    </a>
    <a href="reports.html" class="nav-item">
      <span>📑</span>
      <span>Reports</span>
    </a>
    <a href="bookings.html" class="nav-item">
      <span>📍</span>
      <span>Track Booking</span>
    </a>
    <a href="cart.html" class="nav-item">
      <span>🛒</span>
      <span>Cart</span>
      <span class="cart-badge" style="display:none;">0</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span>👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Core JavaScript Scripts -->
  <script src="assets/js/config.js?v=5.4.0"></script>
  <script src="assets/js/utils.js?v=5.4.0"></script>
  <script src="assets/js/api.js?v=5.4.0"></script>
  <script src="assets/js/offline-db.js?v=5.4.0"></script>
  <script src="assets/js/offline-sync.js?v=5.4.0"></script>
  <script src="assets/js/auth.js?v=5.4.0"></script>
  <script src="assets/js/app.js?v=5.4.0"></script>
  <script src="assets/js/packages.js?v=5.4.0"></script>
</body>
</html>
